<form [formGroup]="loginForm" (ngSubmit)="handleSubmit()">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title i18n="@@login.title"
        >De retour sur DevLife !</mat-card-title
      >
      <mat-card-subtitle i18n="@@login.subtitle"
        >Entrez votre email et votre mot de passe pour reprendre votre partie
        !</mat-card-subtitle
      >
    </mat-card-header>
    <mat-card-content class="login-card-content">
      <mat-form-field subscriptSizing="dynamic" appearance="outline">
        <mat-label i18n="@@login.email">E-mail</mat-label>
        <input formControlName="email" matInput type="email" />
      </mat-form-field>

      <mat-form-field subscriptSizing="dynamic" appearance="outline">
        <mat-label i18n="@@login.password">Mot de passe</mat-label>
        <input
          formControlName="password"
          [type]="isPasswordHided() ? 'password' : 'text'"
          matInput
        />
        <button
          class="mr-2"
          type="button"
          mat-icon-button
          matSuffix
          (click)="hidePassword($event)"
        >
          <mat-icon class="icon-outlined">{{
            isPasswordHided() ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions class="login-card-footer">
      <a [routerLink]="['/']">
        <button i18n="@@login.returnbtn" mat-button>Retour a l'accueil</button>
      </a>
      <button i18n="@@login.loginbtn" type="submit" mat-stroked-button>
        Se connecter
      </button>
    </mat-card-actions>
  </mat-card>
</form>
